name: Test and release Foundry module
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/checkout@v4
        with:
          repository: foundryvtt/dnd5e
          ref: 3ee48de02f8f6f7b2638c9f6cf3e9540c9c181cc
          path: .reference/dnd5e
          sparse-checkout: |
            module
            system.json
      - name: Check JavaScript and regressions against D&D5e 6.0.5
        env:
          DND5E_SOURCE: .reference/dnd5e
        run: |
          node --check scripts/bleeding.js
          node --test tests/bleeding.test.mjs
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifest and tag
        run: |
          node -e 'const fs = require("fs"); const m = JSON.parse(fs.readFileSync("module.json", "utf8")); if (process.env.GITHUB_REF_NAME !== `v${m.version}`) throw new Error("Tag and manifest version differ"); for (const p of m.esmodules) if (!fs.existsSync(p)) throw new Error(`Missing file: ${p}`);'
      - name: Package module
        run: |
          mkdir -p dist/bagrovoe-bleeding
          cp module.json README.md CHANGELOG.md TESTING.md dist/bagrovoe-bleeding/
          cp -r scripts icons dist/bagrovoe-bleeding/
          cd dist
          zip -r ../bagrovoe-bleeding.zip bagrovoe-bleeding
          cd ..
          sha256sum bagrovoe-bleeding.zip module.json > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          name: Багровое Причастие 3.1.0
          fail_on_unmatched_files: true
          body_path: RELEASE_NOTES.md
          files: |
            bagrovoe-bleeding.zip
            module.json
            SHA256SUMS.txt
