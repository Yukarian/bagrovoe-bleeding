name: Test and release Foundry module
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/checkout@v4
        with:
          repository: foundryvtt/dnd5e
          ref: 87e94dbd9f930135e0694cd7e7d49f210603cd2c
          path: .reference/dnd5e
          sparse-checkout: |
            module
            system.json
      - name: Check JavaScript and regressions against D&D5e 6.0.6
        env:
          DND5E_SOURCE: .reference/dnd5e
        run: |
          node --check scripts/bleeding.js
          node --check scripts/blood-magic.js
          node --check scripts/spell-runtime.js
          node --check scripts/relics.js
          node --check scripts/new-spells.js
          node --check scripts/siblings.js
          node --check scripts/villages.js
          node --check scripts/bastion-bridge.mjs
          node --check scripts/library.mjs
          node --check scripts/key-npcs.mjs
          node --check scripts/leorina.mjs
          node --check scripts/raess.mjs
          node --check scripts/tower.mjs
          node --check scripts/npc-names.mjs
          node --check scripts/expanded-spells.js
          node --check scripts/spellbooks.js
          node --check scripts/communion.js
          node --check scripts/village-model.mjs
          node --check scripts/village-development.mjs
          node --check scripts/village-economy.mjs
          node --check scripts/economy-view.mjs
          node --check scripts/economy-dialog.mjs
          node --check scripts/village-storage.mjs
          node --check scripts/development-runtime.mjs
          node --check scripts/development-view.mjs
          node --check scripts/development-ui.mjs
          node --check scripts/westerholm-content.mjs
          node --check scripts/village-view.mjs
          node --check scripts/village-simple.mjs
          node --check scripts/village-events.mjs
          node --check scripts/ortes-date.mjs
          node --check scripts/ortes-clock.mjs
          node --check scripts/ortes-calendar.mjs
          node --test tests/*.test.mjs
  release:
    if: github.ref == 'refs/heads/main'
    needs: test
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifest and tag
        run: |
          node -e 'const fs = require("fs"); const m = JSON.parse(fs.readFileSync("module.json", "utf8")); for (const p of m.esmodules) if (!fs.existsSync(p)) throw new Error(`Missing file: ${p}`);'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build and verify native compendiums
        run: |
          npm ci
          node scripts/build-pack.mjs
      - name: Package module
        run: |
          mkdir -p dist/bagrovoe-bleeding
          cp module.json README.md CHANGELOG.md TESTING.md CONTENT_MODULE.md RELEASE_NOTES.md NEW_NPCS.md SPELLS.md RELICS.md SIBLINGS.md FOLDERS.md SETTLEMENTS.md SETTLEMENT_EVENTS.md SUIGU.md COMMUNION_NPCS.md SPELLBOOKS.md KEY_NPCS.md LEORINA.md VALKREIN.md TOWER_COUNCIL.md GROVE_COUNCIL.md ART_PROMPTS_GROVE.md ART_PROMPTS_TOWER.md ART_PROMPTS_KEY_NPCS.md SRD_ATTRIBUTION.md ARCHMAGE.md MIDNIGHT_ORDER.md RAESS.md RAESS_COMPANY.md dist/bagrovoe-bleeding/
          cp -r scripts styles icons assets packs bandits exports dist/bagrovoe-bleeding/
          cd dist
          zip -r ../bagrovoe-bleeding.zip bagrovoe-bleeding
          cd ..
          sha256sum bagrovoe-bleeding.zip module.json > SHA256SUMS.txt
      - name: Publish versioned release when tests pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./module.json').version")
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving published assets untouched"
            exit 0
          fi
          gh release create "$TAG" bagrovoe-bleeding.zip module.json SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "Мир Ортес $VERSION" \
            --notes-file RELEASE_NOTES.md
